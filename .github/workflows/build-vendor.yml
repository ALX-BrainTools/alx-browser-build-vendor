name: Build Vendor Bundle

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - ".github/workflows/build-vendor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Create vendor archive
        run: |
          set -euo pipefail
          mkdir -p out
          tar -czf out/alx-browser-build-vendor.tgz node_modules package-lock.json
          sha256sum out/alx-browser-build-vendor.tgz > out/alx-browser-build-vendor.tgz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: alx-browser-build-vendor
          path: out/*
          if-no-files-found: error
